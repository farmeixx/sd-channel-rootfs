# Mainline kernel configuration for Motorola Moto G7 Play (channel / SDM632).
# To port to another device, edit this file, not the shared .sh scripts.

#------------------------------------------------------------------#

# Kernel source checkout. The LOCAL builder clones this branch shallowly,
# once, into sources/linux, and keeps that checkout between builds; updating
# the tree is a manual step (git -C sources/linux pull --ff-only). The
# resolved commit sha is recorded in source-report.txt so each checkpoint
# maps to exactly one source commit.

KERNEL_URL="https://gitlab.com/vanadium-oss/motorola-msm8953/mainline/linux.git"
KERNEL_REF="msm8953/latest"

#------------------------------------------------------------------#

# Cross build contract. make receives ARCH=$KERNEL_ARCH and
# CROSS_COMPILE=$KERNEL_CROSS_COMPILE; the LOCAL builder places a ccache shim
# in front of the cross compiler so every object is cached between runs.
# KERNEL_BASE_CONFIG is a make target (not a file path) that seeds .config
# before the fragment slots below.

KERNEL_ARCH="arm64"
KERNEL_CROSS_COMPILE="aarch64-linux-gnu-"
KERNEL_BASE_CONFIG="defconfig"

#------------------------------------------------------------------#

# Config fragment slots. Empty string ignores a slot, a relative path
# resolves inside the cloned kernel source, and repo:PATH points into this
# builder workspace. merge_config.sh runs first; KERNEL_ENABLE_* (scripts/
# config) and olddefconfig follow, so an explicit enable always wins.
# Slot 2 is the channel-only fragment (merged after defconfig and
# msm8953.config).
# The release label is NOT a slot: the local builder applies it via
# scripts/config from conf/kernel.conf (KERNEL_LOCALVERSION).

KERNEL_CONFIG_1="arch/arm64/configs/msm8953.config"
KERNEL_CONFIG_2="arch/arm64/configs/motorola-channel.config"

#------------------------------------------------------------------#

# The release label lives in the LOCAL builder conf (conf/kernel.conf →
# KERNEL_LOCALVERSION, re-asserted by scripts/config in sh/build.sh), so this
# file stays device-only.

#------------------------------------------------------------------#

# Additional options explicitly requested for this device (empty arrays: no edits).
# Why these two: QCOM_CPR4PD owns the CPU power rail request on msm8953 and
# QCOM_CLK_APCS_MSM8953 owns the A53 cluster APCS clock mux; the pair drives
# CPU frequency scaling on channel. Arrays feed scripts/config after the
# fragment merge; an empty array is a no-op.

KERNEL_ENABLE_Y=(QCOM_CPR4PD QCOM_CLK_APCS_MSM8953)
KERNEL_ENABLE_M=()

#------------------------------------------------------------------#

# Built DTB path inside kernel source; no DTB name/path is hardcoded in the .sh.
# Built output paths are configured here, never hardcoded in the .sh.
# Image.gz concatenates with the DTB into the boot payload.

KERNEL_DTB="arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dtb"
KERNEL_IMAGE_TARGET="Image.gz"
KERNEL_IMAGE_PATH="arch/arm64/boot/Image.gz"

#------------------------------------------------------------------#

# Optional DTB postprocess hook for a builder script (repo:PATH or /absolute).
# Empty: no device-tree modifications.

KERNEL_DTB_POSTPROCESS=""

#------------------------------------------------------------------#

# Android boot image settings are device-specific too.
# Android boot contract: rootfs boots from PARTLABEL=sdcard, debug flows
# over UART ttyMSM0 and USB RNDIS. The packer writes the resolved cmdline
# next to the packed image. Base, offsets, page size and header version
# match the msm8953 bootloader.

KERNEL_BOOT_NAME="boot-channel.img"
KERNEL_ROOT_DEVICE="PARTLABEL=sdcard"
KERNEL_CMDLINE="console=ttyMSM0,115200n8 console=tty0 root=PARTLABEL=sdcard rootfstype=ext4 rootwait rw loglevel=7 ignore_loglevel"
KERNEL_BOOT_HEADER_VERSION=0
KERNEL_BOOT_BASE="0x80000000"
KERNEL_BOOT_KERNEL_OFFSET="0x00008000"
KERNEL_BOOT_RAMDISK_OFFSET="0x01000000"
KERNEL_BOOT_SECOND_OFFSET="0x00f00000"
KERNEL_BOOT_TAGS_OFFSET="0x00000100"
KERNEL_BOOT_PAGE_SIZE=2048

#------------------------------------------------------------------#

# mkbootimg is fetched from AOSP and checked out detached at this exact
# commit, so tool changes cannot silently alter the boot image layout.

KERNEL_MKBOOTIMG_URL="https://android.googlesource.com/platform/system/tools/mkbootimg"
KERNEL_MKBOOTIMG_REF="d3b6ee4295e1491432ce3d0fcfd53631177bbef4"

#------------------------------------------------------------------#
