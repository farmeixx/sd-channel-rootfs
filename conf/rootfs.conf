# Rootfs images. The python raw-rootfs generator turns these into its fixed
# ext4 policy (raw output, no zstd). Per-distro free minimums keep each
# distro's own default unless overridden here.
IMAGE_SIZE_MB="1024"
IMAGE_FREE_MIN_ALPINE="32"
IMAGE_FREE_MIN_DEBIAN_UBUNTU="64"
DISTROS="alpine debian ubuntu"

#------------------------------------------------------------------#

# SD-card disk image: one GPT partition carrying the ext4 root,
# written to the microSD with dd / BalenaEtcher / Rufus. Must match the
# kernel cmdline (root=PARTLABEL=sdcard) in conf/mainline.conf on the
# main branch.
ROOT_PARTITION_LABEL="sdcard"

DEBIAN_SUITE="stable"
UBUNTU_VERSION=""
